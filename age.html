<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Age Group</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      overflow-x: hidden;
      background: linear-gradient(135deg, #fff9f2, #d0f0fd);
      position: relative;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      color: #fff;
      font-size: 2rem;
      text-shadow: 3px 3px #ff69b4;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    nav a {
      text-decoration: none;
      background: #ffd700;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      color: #333;
      transition: transform 0.3s, background 0.3s;
    }

    nav a:hover {
      background: #ff7f7f;
      color: #fff;
      transform: scale(1.1) rotate(-2deg);
    }

    .container.age-container {
      text-align: center;
      padding: 30px 20px;
    }

    .age-container h2 {
      color: #ff69b4;
      font-size: 1.8rem;
      margin-bottom: 10px;
      animation: fadeIn 1s ease;
    }

    .age-container .subtitle {
      font-size: 1rem;
      color: #333;
      margin-bottom: 30px;
    }

    .quiz-btn {
      display: inline-block;
      margin: 10px;
      padding: 15px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      border: none;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: white;
      cursor: pointer;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
      transition: all 0.3s;
      animation: bounce 2s infinite;
    }

    .quiz-btn:hover {
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
      background: linear-gradient(135deg, #fad0c4, #ff9a9e);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Running Character */
    #character {
      position: fixed;
      bottom: 20px;
      left: -100px;
      width: 80px;
      height: 80px;
      z-index: 1000;
      pointer-events: none;
      transition: transform 0.1s;
    }

    /* Bouncing balls */
    .ball {
      position: absolute;
      border-radius: 50%;
      opacity: 0.7;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Select Your Age Group</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="rights.html">Rights</a>
    <a href="age.html">Quiz</a>
    <a href="about.html">About</a>
  </nav>

  <div class="container age-container">
    <h2 class="fade-in">Let's find the perfect quiz for you 🎯</h2>
    <p class="subtitle">Choose your age group to begin the fun!</p>
    <button class="quiz-btn" onclick="startQuiz('8-12')">8 - 12 Years</button>
    <button class="quiz-btn" onclick="startQuiz('13-16')">13 - 16 Years</button>
  </div>

  <!-- Running Character -->
  <img id="character" src="images/running-character.gif" alt="Running Character">

  <audio id="popSound" src="sounds/pop.mp3"></audio>

  <script>
    function startQuiz(ageGroup) {
      localStorage.setItem('ageGroup', ageGroup);
      window.location.href = 'quiz.html';
    }

    // Interactive running character
    const character = document.getElementById('character');
    let x = -100;
    let y = window.innerHeight - 120;
    let dx = 3;

    function moveCharacter() {
      x += dx;
      if(x > window.innerWidth) {
        x = -100; 
        y = Math.random() * (window.innerHeight - 150); 
      }
      character.style.left = x + 'px';
      character.style.top = y + 'px';
      requestAnimationFrame(moveCharacter);
    }
    moveCharacter();

    character.addEventListener('mouseenter', () => {
      dx = -dx; 
      character.style.transform = 'scaleX(-1)'; 
    });
    character.addEventListener('mouseleave', () => {
      character.style.transform = 'scaleX(1)';
    });

    // Bouncing balls
    const colors = ['#FF9A9E', '#FAD0C4', '#FFD1DC', '#FFF0F5', '#FFB6C1'];
    const balls = [];

    for(let i=0; i<20; i++){
      const ball = document.createElement('div');
      ball.classList.add('ball');
      const size = Math.random()*30 + 20;
      ball.style.width = ball.style.height = size+'px';
      ball.style.background = colors[Math.floor(Math.random()*colors.length)];
      ball.style.left = Math.random()*window.innerWidth + 'px';
      ball.style.top = Math.random()*window.innerHeight + 'px';
      document.body.appendChild(ball);
      balls.push({el: ball, dx: (Math.random()-0.5)*3, dy: (Math.random()-0.5)*3});

      ball.addEventListener('click', () => {
        document.getElementById('popSound').play();
        ball.style.transform = 'scale(0)';
        setTimeout(()=>ball.style.transform='scale(1)',200);
      });
    }

    function animateBalls(){
      balls.forEach(b=>{
        let x = parseFloat(b.el.style.left);
        let y = parseFloat(b.el.style.top);
        if(x+b.el.offsetWidth>window.innerWidth || x<0) b.dx*=-1;
        if(y+b.el.offsetHeight>window.innerHeight || y<0) b.dy*=-1;
        b.el.style.left = x+b.dx+'px';
        b.el.style.top = y+b.dy+'px';
      });
      requestAnimationFrame(animateBalls);
    }
    animateBalls();
  </script>
</body>
</html>
